[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openjev-experiment"
version = "0.1.0"
description = "Reproducible local experiments with parallel constrained decisions"
requires-python = ">=3.12"
dependencies = ["torch==2.11.0", "transformers==5.17.0", "accelerate==1.15.0"]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.16"]

[project.scripts]
openjev = "openjev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
