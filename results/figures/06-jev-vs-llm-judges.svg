<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">One pass versus deliberation in an audit</title><desc id="desc">Left, a scatter of accuracy against cost per case on a log scale. Jev: 80.0 percent at about 0.0006 dollars and 1.1 seconds. Luna: 95.6 percent at about 0.002 dollars and 69.6 seconds; Luna with one turn: 97.8 percent at about 0.002 dollars and 24.6 seconds. Sonnet: 100 percent at about 0.12 to 0.17 dollars and 42.6 to 45.7 seconds, for its one-turn and full runs. Right, a table of error direction: flawed semantics accepted out of 27 and faithful semantics rejected out of 18. Jev 0 and 9; Luna 2 and 0; Luna one turn 1 and 0; Sonnet 0 and 0; Sonnet one turn 0 and 0. A note reads: here a Jev acceptance was reliable; a Jev rejection meant look closer. Footnotes describe the 45-case experiment, 27 flawed and 18 faithful, costs via OpenRouter, and that one turn means a single response without tools.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29465c"/></marker></defs><rect width="1600" height="900" fill="white"/><g fill="#171717" font-family="Cambria, Georgia, Times New Roman, serif"><text xml:space="preserve" x="70" y="88" font-size="48" font-weight="600">One pass versus deliberation in an audit</text><text xml:space="preserve" x="70" y="143" font-size="29" fill="#555555">Jev and LLM judges decide whether a formal semantics captures the intent it was written for.</text><text xml:space="preserve" x="70" y="226" font-size="30" font-weight="600">Accuracy against cost per case</text><line x1="190" y1="690" x2="860" y2="690" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="176" y="698" font-size="23" text-anchor="end" fill="#555555">75%</text><line x1="190" y1="616" x2="860" y2="616" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="176" y="624" font-size="23" text-anchor="end" fill="#555555">80%</text><line x1="190" y1="542" x2="860" y2="542" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="176" y="550" font-size="23" text-anchor="end" fill="#555555">85%</text><line x1="190" y1="468" x2="860" y2="468" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="176" y="476" font-size="23" text-anchor="end" fill="#555555">90%</text><line x1="190" y1="394" x2="860" y2="394" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="176" y="402" font-size="23" text-anchor="end" fill="#555555">95%</text><line x1="190" y1="320" x2="860" y2="320" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="176" y="328" font-size="23" text-anchor="end" fill="#555555">100%</text><line x1="190" y1="320" x2="190" y2="690" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="190" y="724" font-size="23" text-anchor="middle" fill="#555555">$0.0001</text><line x1="357.5" y1="320" x2="357.5" y2="690" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="357.5" y="724" font-size="23" text-anchor="middle" fill="#555555">$0.001</text><line x1="525" y1="320" x2="525" y2="690" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="525" y="724" font-size="23" text-anchor="middle" fill="#555555">$0.01</text><line x1="692.5" y1="320" x2="692.5" y2="690" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="692.5" y="724" font-size="23" text-anchor="middle" fill="#555555">$0.10</text><line x1="860" y1="320" x2="860" y2="690" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="860" y="724" font-size="23" text-anchor="middle" fill="#555555">$1</text><line x1="190" y1="690" x2="860" y2="690" stroke="#b5b5b5" stroke-width="2"/><text xml:space="preserve" x="525" y="762" font-size="24" text-anchor="middle" fill="#555555">Cost per case (US dollars, log scale)</text><circle cx="320.34" cy="616" r="10" fill="#29465c" stroke="white" stroke-width="3"/><circle cx="407.92" cy="385.12" r="8" fill="#8a8a8a" stroke="white" stroke-width="3"/><circle cx="407.92" cy="352.56" r="8" fill="#8a8a8a" stroke="white" stroke-width="3"/><circle cx="705.76" cy="320" r="8" fill="#8a8a8a" stroke="white" stroke-width="3"/><circle cx="731.1" cy="320" r="8" fill="#8a8a8a" stroke="white" stroke-width="3"/><text xml:space="preserve" x="340.34" y="625" font-size="27" stroke="white" stroke-width="8" stroke-linejoin="round" paint-order="stroke" font-weight="600">Jev · 1.1 s</text><text xml:space="preserve" x="425.92" y="411.12" font-size="24" stroke="white" stroke-width="8" stroke-linejoin="round" paint-order="stroke" >Luna · 69.6 s</text><text xml:space="preserve" x="425.92" y="348.56" font-size="24" stroke="white" stroke-width="8" stroke-linejoin="round" paint-order="stroke" >Luna, one turn · 24.6 s</text><text xml:space="preserve" x="718.43" y="300" font-size="24" stroke="white" stroke-width="8" stroke-linejoin="round" paint-order="stroke" text-anchor="middle">Sonnet, both runs · 42.6–45.7 s</text><text xml:space="preserve" x="960" y="226" font-size="30" font-weight="600">Which way the errors go</text><text xml:space="preserve" x="960" y="280" font-size="23" fill="#555555">Judge</text><text xml:space="preserve" x="1296" y="280" font-size="23" text-anchor="end" fill="#555555">Flawed accepted</text><text xml:space="preserve" x="1530" y="280" font-size="23" text-anchor="end" fill="#555555">Faithful rejected</text><text xml:space="preserve" x="1296" y="308" font-size="22" text-anchor="end" fill="#555555">of 27</text><text xml:space="preserve" x="1530" y="308" font-size="22" text-anchor="end" fill="#555555">of 18</text><line x1="960" y1="326" x2="1530" y2="326" stroke="#171717" stroke-width="2"/><rect x="960" y="340" width="570" height="50" fill="#eef2f5"/><text xml:space="preserve" x="976" y="374" font-size="27" font-weight="600">Jev</text><text xml:space="preserve" x="1284" y="374" font-size="28" text-anchor="end" font-weight="600">0</text><text xml:space="preserve" x="1518" y="374" font-size="28" text-anchor="end" font-weight="600">9</text><line x1="960" y1="390" x2="1530" y2="390" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="976" y="428" font-size="27" >Luna</text><text xml:space="preserve" x="1284" y="428" font-size="28" text-anchor="end" >2</text><text xml:space="preserve" x="1518" y="428" font-size="28" text-anchor="end" >0</text><line x1="960" y1="444" x2="1530" y2="444" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="976" y="482" font-size="27" >Luna, one turn</text><text xml:space="preserve" x="1284" y="482" font-size="28" text-anchor="end" >1</text><text xml:space="preserve" x="1518" y="482" font-size="28" text-anchor="end" >0</text><line x1="960" y1="498" x2="1530" y2="498" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="976" y="536" font-size="27" >Sonnet</text><text xml:space="preserve" x="1284" y="536" font-size="28" text-anchor="end" >0</text><text xml:space="preserve" x="1518" y="536" font-size="28" text-anchor="end" >0</text><line x1="960" y1="552" x2="1530" y2="552" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="976" y="590" font-size="27" >Sonnet, one turn</text><text xml:space="preserve" x="1284" y="590" font-size="28" text-anchor="end" >0</text><text xml:space="preserve" x="1518" y="590" font-size="28" text-anchor="end" >0</text><line x1="960" y1="606" x2="1530" y2="606" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="960" y="680" font-size="26" >Here a Jev acceptance was reliable;</text><text xml:space="preserve" x="960" y="716" font-size="26" >a Jev rejection meant: look closer.</text><text xml:space="preserve" x="70" y="836" font-size="22" fill="#555555">A separate experiment: does a formal semantics truly represent the stated intent? 45 cases, 27 flawed and 18 faithful. Cost via OpenRouter.</text><text xml:space="preserve" x="70" y="866" font-size="22" fill="#555555">One turn means a single response without tools; the other LLM runs could use tools over several turns.</text></g></svg>