<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">What moved the needle</title><desc id="desc">A table of eight interventions with their measured effect and outcome. Contrast families of 300 scenarios: fresh test 71.4 to 95.3 percent, broad tasks minus 4.0 points, helped with a cost. Natural instead of templated language: evidence-contrast pairs plus 5.6 points, accuracy plus 1.1, helped modestly. Broader rubrics: contrast pairs plus 4.6 points, helped. Eight times more synthetic families: accuracy 78.9 to 78.6 percent, log loss 0.79 to 1.55, no gain. Cross-entropy plus Brier loss: contrast pairs plus 1.0 with an interval spanning zero, no clear gain. Teacher targets from Qwen3.5-4B and Jev: contrast pairs minus 9.0 and minus 4.6 points versus hard labels, no gain. Larger readout heads: training fit 200 of 200 but no held-out gain. Temperature scaling: log loss 1.55 to 0.51 with zero answers changed, confidence only. Notes state one training seed per arm, that pair metrics require both answers correct with family-bootstrap intervals, and that broad tasks are 1,500 held-out public-dataset judgments.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29465c"/></marker></defs><rect width="1600" height="900" fill="white"/><g fill="#171717" font-family="Cambria, Georgia, Times New Roman, serif"><text xml:space="preserve" x="70" y="88" font-size="48" font-weight="600">What moved the needle</text><text xml:space="preserve" x="70" y="143" font-size="29" fill="#555555">Interventions on Qwen3.5-2B, each compared with a baseline from the same study.</text><text xml:space="preserve" x="70" y="214" font-size="27" font-weight="600">Intervention</text><text xml:space="preserve" x="620" y="214" font-size="27" font-weight="600">Measured effect</text><text xml:space="preserve" x="1262" y="214" font-size="27" font-weight="600">Outcome</text><line x1="70" y1="234" x2="1530" y2="234" stroke="#171717" stroke-width="2"/><text xml:space="preserve" x="70" y="282" font-size="27" >Contrast families, 300 scenarios</text><text xml:space="preserve" x="620" y="282" font-size="25" >Fresh test 71.4% → 95.3%; broad tasks −4.0 points</text><circle cx="1272" cy="273" r="9" fill="#29465c"/><text xml:space="preserve" x="1294" y="282" font-size="26" font-weight="600">Helped, with a cost</text><line x1="70" y1="306" x2="1530" y2="306" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="70" y="346" font-size="27" >Natural instead of templated language</text><text xml:space="preserve" x="620" y="346" font-size="25" >Evidence-contrast pairs +5.6 points; accuracy +1.1</text><circle cx="1272" cy="337" r="9" fill="#29465c"/><text xml:space="preserve" x="1294" y="346" font-size="26" font-weight="600">Helped modestly</text><line x1="70" y1="370" x2="1530" y2="370" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="70" y="410" font-size="27" >Broader rubrics</text><text xml:space="preserve" x="620" y="410" font-size="25" >Contrast pairs +4.6 points</text><circle cx="1272" cy="401" r="9" fill="#29465c"/><text xml:space="preserve" x="1294" y="410" font-size="26" font-weight="600">Helped</text><line x1="70" y1="434" x2="1530" y2="434" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="70" y="474" font-size="27" >8× more synthetic families</text><text xml:space="preserve" x="620" y="474" font-size="25" >Accuracy 78.9% → 78.6%; log loss 0.79 → 1.55</text><circle cx="1272" cy="465" r="8" fill="white" stroke="#8a8a8a" stroke-width="2.5"/><text xml:space="preserve" x="1294" y="474" font-size="26" >No gain</text><line x1="70" y1="498" x2="1530" y2="498" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="70" y="538" font-size="27" >Cross-entropy plus Brier loss</text><text xml:space="preserve" x="620" y="538" font-size="25" >Contrast pairs +1.0 (interval spans zero)</text><circle cx="1272" cy="529" r="8" fill="white" stroke="#8a8a8a" stroke-width="2.5"/><text xml:space="preserve" x="1294" y="538" font-size="26" >No clear gain</text><line x1="70" y1="562" x2="1530" y2="562" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="70" y="602" font-size="27" >Teacher targets: Qwen3.5-4B, Jev</text><text xml:space="preserve" x="620" y="602" font-size="25" >Contrast pairs −9.0 and −4.6 points vs. hard labels</text><circle cx="1272" cy="593" r="8" fill="white" stroke="#8a8a8a" stroke-width="2.5"/><text xml:space="preserve" x="1294" y="602" font-size="26" >No gain</text><line x1="70" y1="626" x2="1530" y2="626" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="70" y="666" font-size="27" >Larger readout heads</text><text xml:space="preserve" x="620" y="666" font-size="25" >Training fit 200/200; no held-out gain</text><circle cx="1272" cy="657" r="8" fill="white" stroke="#8a8a8a" stroke-width="2.5"/><text xml:space="preserve" x="1294" y="666" font-size="26" >No gain</text><line x1="70" y1="690" x2="1530" y2="690" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="70" y="730" font-size="27" >Temperature scaling</text><text xml:space="preserve" x="620" y="730" font-size="25" >Log loss 1.55 → 0.51; zero answers changed</text><circle cx="1272" cy="721" r="8" fill="white" stroke="#29465c" stroke-width="2.5"/><path d="M1272,713 A8,8 0 0 1 1272,729 Z" fill="#29465c"/><text xml:space="preserve" x="1294" y="730" font-size="26" >Confidence only</text><line x1="70" y1="754" x2="1530" y2="754" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="70" y="806" font-size="24" fill="#555555">One training seed per arm. Pair metrics require both answers of a contrast to be correct; intervals are family-bootstrap 95%.</text><text xml:space="preserve" x="70" y="840" font-size="24" fill="#555555">Broad tasks: 1,500 held-out judgments from the public datasets. Log loss is the mean negative log-likelihood.</text></g></svg>