<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Building with a judgment model</title><desc id="desc">Left, five question-design practices. One: make each question self-contained, because IDs and sibling questions never reach the model; moving shared definitions into the state raised Jev from 86 to 99 of 100 correct. Two: describe every Score level as a situation, because each level is judged alone. Three: ask what to look for, not how many, because it reads literally and does not count reliably. Four: offer Unknown explicitly when evidence can be missing or conflicting. Five: supply the candidates; Jev selects and code extracts and validates. Right, a decision workflow: a record, then Jev answering many narrow questions in one request, then your decision rule with weights and thresholds fitted to your labels, which leads either to act or to escalate to an LLM. Notes describe Slop Alarm: eight questions per chunk in one request at about 0.00008 dollars per 250 words; the question &quot;Was this written by AI?&quot; alone rated neutral human prose 0.7 to 0.8, while a fitted formula over four signals reached AUC 0.97 in cross-validation on 92 samples.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29465c"/></marker></defs><rect width="1600" height="900" fill="white"/><g fill="#171717" font-family="Cambria, Georgia, Times New Roman, serif"><text xml:space="preserve" x="70" y="88" font-size="48" font-weight="600">Building with a judgment model</text><text xml:space="preserve" x="70" y="143" font-size="29" fill="#555555">Practices that held up in our tests and in Slop Alarm, an AI-text detector built on Jev.</text><text xml:space="preserve" x="70" y="226" font-size="30" font-weight="600">Question design</text><line x1="70" y1="246" x2="860" y2="246" stroke="#171717" stroke-width="2"/><text xml:space="preserve" x="70" y="296" font-size="27" fill="#29465c" font-weight="600">1.</text><text xml:space="preserve" x="104" y="296" font-size="27" font-weight="600">Make each question self-contained</text><text xml:space="preserve" x="104" y="330" font-size="23" fill="#555555">IDs and sibling questions never reach it. Moving shared</text><text xml:space="preserve" x="104" y="360" font-size="23" fill="#555555">definitions into the state: 86 → 99 of 100 correct.</text><text xml:space="preserve" x="70" y="408" font-size="27" fill="#29465c" font-weight="600">2.</text><text xml:space="preserve" x="104" y="408" font-size="27" font-weight="600">Describe every Score level as a situation</text><text xml:space="preserve" x="104" y="442" font-size="23" fill="#555555">Each level is judged alone, without its number</text><text xml:space="preserve" x="104" y="472" font-size="23" fill="#555555">or its neighbors.</text><text xml:space="preserve" x="70" y="520" font-size="27" fill="#29465c" font-weight="600">3.</text><text xml:space="preserve" x="104" y="520" font-size="27" font-weight="600">Ask what to look for, not how many</text><text xml:space="preserve" x="104" y="554" font-size="23" fill="#555555">It reads literally and does not count reliably.</text><text xml:space="preserve" x="70" y="604" font-size="27" fill="#29465c" font-weight="600">4.</text><text xml:space="preserve" x="104" y="604" font-size="27" font-weight="600">Offer Unknown explicitly</text><text xml:space="preserve" x="104" y="638" font-size="23" fill="#555555">When evidence can be missing or conflicting.</text><text xml:space="preserve" x="70" y="688" font-size="27" fill="#29465c" font-weight="600">5.</text><text xml:space="preserve" x="104" y="688" font-size="27" font-weight="600">Supply the candidates</text><text xml:space="preserve" x="104" y="722" font-size="23" fill="#555555">Jev selects among them; code extracts and validates.</text><text xml:space="preserve" x="960" y="226" font-size="30" font-weight="600">Decision workflow</text><line x1="960" y1="246" x2="1530" y2="246" stroke="#171717" stroke-width="2"/><rect x="990" y="264" width="510" height="88" fill="white" stroke="#171717" stroke-width="2"/><text xml:space="preserve" x="1245" y="302" font-size="28" text-anchor="middle" font-weight="600">Record</text><text xml:space="preserve" x="1245" y="336" font-size="22" text-anchor="middle" fill="#555555">text or JSON state</text><path d="M1245,354 L1245,384" fill="none" stroke="#29465c" stroke-width="3"  marker-end="url(#arrow)"/><rect x="990" y="388" width="510" height="88" fill="white" stroke="#29465c" stroke-width="2"/><text xml:space="preserve" x="1245" y="426" font-size="28" text-anchor="middle" font-weight="600">Jev: many narrow questions</text><text xml:space="preserve" x="1245" y="460" font-size="22" text-anchor="middle" fill="#555555">one request; the state is read once</text><path d="M1245,478 L1245,508" fill="none" stroke="#29465c" stroke-width="3"  marker-end="url(#arrow)"/><rect x="990" y="512" width="510" height="88" fill="white" stroke="#171717" stroke-width="2"/><text xml:space="preserve" x="1245" y="550" font-size="28" text-anchor="middle" font-weight="600">Your decision rule</text><text xml:space="preserve" x="1245" y="584" font-size="22" text-anchor="middle" fill="#555555">weights and thresholds fitted to your labels</text><path d="M1150,602 L1150,640" fill="none" stroke="#29465c" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1415,602 L1415,640" fill="none" stroke="#29465c" stroke-width="3"  marker-end="url(#arrow)"/><rect x="990" y="644" width="320" height="76" fill="white" stroke="#171717" stroke-width="2"/><text xml:space="preserve" x="1150" y="692" font-size="28" text-anchor="middle" font-weight="600">Act</text><rect x="1330" y="644" width="170" height="76" fill="white" stroke="#171717" stroke-width="2"/><text xml:space="preserve" x="1415" y="682" font-size="26" text-anchor="middle" font-weight="600">Escalate</text><text xml:space="preserve" x="1415" y="708" font-size="20" text-anchor="middle" fill="#555555">to an LLM</text><line x1="70" y1="772" x2="1530" y2="772" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="70" y="814" font-size="23" fill="#555555">Slop Alarm asks eight questions per text chunk in one request, about $0.00008 per 250 words. “Was this written by AI?” alone</text><text xml:space="preserve" x="70" y="848" font-size="23" fill="#555555">rated neutral human prose 0.7–0.8; a fitted formula over four signals reached AUC 0.97 in cross-validation on 92 samples.</text></g></svg>