<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Contrast families teach distinctions</title><desc id="desc">An illustrative contrast family in a four-row table. Assistant statement &quot;I have sent invoice 17.&quot; with no execution evidence: claimed completion yes, completion confirmed no; the same statement with a matching success: yes and yes; &quot;I will send invoice 17.&quot; with a matching success: no and yes; the same future statement with no evidence: no and no. A note calls the first row the trap, because a claim is not confirmation: our public-data model put 96.5 percent on confirmation in such a case and Jev put 6 percent. Below, a five-stage data factory: semantic facts, oracle labels set by rules, language written by GPT-5.6 Terra and Sol, blind review of meaning, and a family-level split that keeps siblings together. Notes describe Jev&apos;s role as a source of disagreements for review and, in one screen, soft targets, never gold labels, and list the ten categories.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29465c"/></marker></defs><rect width="1600" height="900" fill="white"/><g fill="#171717" font-family="Cambria, Georgia, Times New Roman, serif"><text xml:space="preserve" x="70" y="88" font-size="48" font-weight="600">Contrast families teach distinctions</text><text xml:space="preserve" x="70" y="143" font-size="29" fill="#555555">Hold the record steady, change one fact or only the question, and check every label.</text><rect x="70" y="196" width="1460" height="50" fill="#eef2f5"/><text xml:space="preserve" x="90" y="230" font-size="26" font-weight="600">Assistant statement</text><text xml:space="preserve" x="490" y="230" font-size="26" font-weight="600">Execution evidence</text><text xml:space="preserve" x="890" y="230" font-size="26" font-weight="600">Claimed completion?</text><text xml:space="preserve" x="1220" y="230" font-size="26" font-weight="600">Completion confirmed?</text><text xml:space="preserve" x="90" y="290" font-size="28" >“I have sent invoice 17.”</text><text xml:space="preserve" x="490" y="290" font-size="28" >none supplied</text><text xml:space="preserve" x="890" y="290" font-size="28" font-weight="600">Yes</text><text xml:space="preserve" x="1220" y="290" font-size="28" font-weight="600">No</text><line x1="70" y1="308" x2="1530" y2="308" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="90" y="346" font-size="28" >“I have sent invoice 17.”</text><text xml:space="preserve" x="490" y="346" font-size="28" >matching success</text><text xml:space="preserve" x="890" y="346" font-size="28" font-weight="600">Yes</text><text xml:space="preserve" x="1220" y="346" font-size="28" font-weight="600">Yes</text><line x1="70" y1="364" x2="1530" y2="364" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="90" y="402" font-size="28" >“I will send invoice 17.”</text><text xml:space="preserve" x="490" y="402" font-size="28" >matching success</text><text xml:space="preserve" x="890" y="402" font-size="28" font-weight="600">No</text><text xml:space="preserve" x="1220" y="402" font-size="28" font-weight="600">Yes</text><line x1="70" y1="420" x2="1530" y2="420" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="90" y="458" font-size="28" >“I will send invoice 17.”</text><text xml:space="preserve" x="490" y="458" font-size="28" >none supplied</text><text xml:space="preserve" x="890" y="458" font-size="28" font-weight="600">No</text><text xml:space="preserve" x="1220" y="458" font-size="28" font-weight="600">No</text><line x1="70" y1="476" x2="1530" y2="476" stroke="#e4e4e4" stroke-width="2"/><rect x="1200" y="254" width="330" height="60" fill="none" stroke="#29465c" stroke-width="2"/><text xml:space="preserve" x="70" y="544" font-size="24" fill="#555555">The first row is the trap: a claim is not confirmation. Our public-data model put 96.5% on confirmation in such a case; Jev put 6%.</text><rect x="70" y="600" width="252" height="112" fill="white" stroke="#171717" stroke-width="2"/><text xml:space="preserve" x="196" y="646" font-size="28" text-anchor="middle" font-weight="600">Semantic facts</text><text xml:space="preserve" x="196" y="684" font-size="21" text-anchor="middle" fill="#555555">who, what, when, result</text><path d="M324,656 L368,656" fill="none" stroke="#29465c" stroke-width="3"  marker-end="url(#arrow)"/><rect x="372" y="600" width="252" height="112" fill="white" stroke="#171717" stroke-width="2"/><text xml:space="preserve" x="498" y="646" font-size="28" text-anchor="middle" font-weight="600">Oracle labels</text><text xml:space="preserve" x="498" y="684" font-size="21" text-anchor="middle" fill="#555555">rules set every answer</text><path d="M626,656 L670,656" fill="none" stroke="#29465c" stroke-width="3"  marker-end="url(#arrow)"/><rect x="674" y="600" width="252" height="112" fill="white" stroke="#29465c" stroke-width="2"/><text xml:space="preserve" x="800" y="646" font-size="28" text-anchor="middle" font-weight="600">Language</text><text xml:space="preserve" x="800" y="684" font-size="21" text-anchor="middle" fill="#555555">GPT-5.6 Terra and Sol</text><path d="M928,656 L972,656" fill="none" stroke="#29465c" stroke-width="3"  marker-end="url(#arrow)"/><rect x="976" y="600" width="252" height="112" fill="white" stroke="#171717" stroke-width="2"/><text xml:space="preserve" x="1102" y="646" font-size="28" text-anchor="middle" font-weight="600">Blind review</text><text xml:space="preserve" x="1102" y="684" font-size="21" text-anchor="middle" fill="#555555">meaning checked</text><path d="M1230,656 L1274,656" fill="none" stroke="#29465c" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1278" y="600" width="252" height="112" fill="white" stroke="#171717" stroke-width="2"/><text xml:space="preserve" x="1404" y="646" font-size="28" text-anchor="middle" font-weight="600">Family split</text><text xml:space="preserve" x="1404" y="684" font-size="21" text-anchor="middle" fill="#555555">siblings stay together</text><text xml:space="preserve" x="70" y="770" font-size="24" fill="#555555">Jev: its disagreements flagged flawed cases for review; in one screen its probabilities served as soft targets. Never gold.</text><text xml:space="preserve" x="70" y="812" font-size="23" fill="#555555">Ten categories: claim vs. completion, permission vs. execution, unknown vs. failure, entity and action binding, temporal scope,</text><text xml:space="preserve" x="70" y="844" font-size="23" fill="#555555">reversal and current state, negation and quantifiers, attribution and endorsement, ordered rubrics.</text></g></svg>