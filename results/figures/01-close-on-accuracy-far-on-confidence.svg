<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Close on accuracy, far apart on confidence</title><desc id="desc">Two bar panels over the same three systems on a frozen test of 700 judgments. Judgments correct: public-data base 82.7 percent, our 2B model 88.1 percent, Jev 1.13 96.9 percent. Confidently wrong answers, meaning wrong answers given at least 90 percent probability: 28, 55 and 1 respectively. Notes explain that the test was written before training, that our model trained on the same ten categories while Jev was not tuned for them, that training took 55.6 plus 12.8 minutes on one RTX 4080, and that on all 800 judgments the accuracies are 87.0 and 95.5 percent.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29465c"/></marker></defs><rect width="1600" height="900" fill="white"/><g fill="#171717" font-family="Cambria, Georgia, Times New Roman, serif"><text xml:space="preserve" x="70" y="88" font-size="48" font-weight="600">Close on accuracy, far apart on confidence</text><text xml:space="preserve" x="70" y="143" font-size="29" fill="#555555">Our 2B model after about 70 minutes of LoRA training, and Jev 1.13, on the same held-out test.</text><text xml:space="preserve" x="470" y="238" font-size="32" font-weight="600">Judgments correct</text><text xml:space="preserve" x="470" y="274" font-size="24" fill="#555555">share of 700 test judgments</text><text xml:space="preserve" x="1040" y="238" font-size="32" font-weight="600">Confidently wrong</text><text xml:space="preserve" x="1040" y="274" font-size="24" fill="#555555">wrong answers given at least 90% probability</text><line x1="470" y1="318" x2="470" y2="632" stroke="#b5b5b5" stroke-width="2"/><line x1="1040" y1="318" x2="1040" y2="632" stroke="#b5b5b5" stroke-width="2"/><text xml:space="preserve" x="430" y="363" font-size="31" text-anchor="end" >Public-data base</text><text xml:space="preserve" x="430" y="395" font-size="23" text-anchor="end" fill="#555555">trained on public datasets only</text><path d="M470,350 H794.8 A6,6 0 0 1 800.8,356 V384 A6,6 0 0 1 794.8,390 H470 Z" fill="#c4c4c4"/><text xml:space="preserve" x="814.8" y="380" font-size="30" >82.7%</text><path d="M1040,350 H1213.2 A6,6 0 0 1 1219.2,356 V384 A6,6 0 0 1 1213.2,390 H1040 Z" fill="#c4c4c4"/><text xml:space="preserve" x="1233.2" y="380" font-size="30" >28</text><text xml:space="preserve" x="430" y="473" font-size="31" text-anchor="end" font-weight="600">Our 2B model</text><text xml:space="preserve" x="430" y="505" font-size="23" text-anchor="end" fill="#555555">Qwen3.5-2B + LoRA, ~70 min</text><path d="M470,460 H816.4 A6,6 0 0 1 822.4,466 V494 A6,6 0 0 1 816.4,500 H470 Z" fill="#29465c"/><text xml:space="preserve" x="836.4" y="490" font-size="30" font-weight="600">88.1%</text><path d="M1040,460 H1386 A6,6 0 0 1 1392,466 V494 A6,6 0 0 1 1386,500 H1040 Z" fill="#29465c"/><text xml:space="preserve" x="1406" y="490" font-size="30" font-weight="600">55</text><text xml:space="preserve" x="430" y="583" font-size="31" text-anchor="end" >Jev 1.13</text><text xml:space="preserve" x="430" y="615" font-size="23" text-anchor="end" fill="#555555">TypeSafe API</text><path d="M470,570 H851.6 A6,6 0 0 1 857.6,576 V604 A6,6 0 0 1 851.6,610 H470 Z" fill="#8a8a8a"/><text xml:space="preserve" x="871.6" y="600" font-size="30" >96.9%</text><path d="M1040,570 H1040.4 A6,6 0 0 1 1046.4,576 V604 A6,6 0 0 1 1040.4,610 H1040 Z" fill="#8a8a8a"/><text xml:space="preserve" x="1060.4" y="600" font-size="30" >1</text><line x1="70" y1="690" x2="1530" y2="690" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="70" y="736" font-size="24" fill="#555555">Frozen test written before training: 35 families, 700 judgments, ten kinds of semantic distinction.</text><text xml:space="preserve" x="70" y="772" font-size="24" fill="#555555">Our model trained on these ten categories; Jev was not tuned for them. Training: 55.6 + 12.8 min on one RTX 4080.</text><text xml:space="preserve" x="70" y="808" font-size="24" fill="#555555">Five further families hid definitions from some questions and are excluded. All 800 judgments: 87.0% vs. 95.5%.</text></g></svg>