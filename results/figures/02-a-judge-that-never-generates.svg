<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">A judge that never generates</title><desc id="desc">Architecture of our Jev-like judge. A record, the shared state, is read once and its cache is forked for every branch. A Noul branch receives the question and feeds a yes/no head that returns the probability of yes. Choice branches receive the question and one option each; Score branches receive the question and one level each. Both feed a candidate head that gives one score per branch, normalized by softmax into a distribution with a winner or an expected level. A note states that rank-8 LoRA adapters and the two heads, 0.45 percent of the parameters, are trained while the Qwen3.5-2B backbone is frozen; the loss is binary cross-entropy for yes/no questions and cross-entropy over each complete candidate group; question IDs, JSON assembly, the Choice winner and the expected Score are handled in code.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29465c"/></marker></defs><rect width="1600" height="900" fill="white"/><g fill="#171717" font-family="Cambria, Georgia, Times New Roman, serif"><text xml:space="preserve" x="70" y="88" font-size="48" font-weight="600">A judge that never generates</text><text xml:space="preserve" x="70" y="143" font-size="29" fill="#555555">Our reproduction scores the allowed answers directly instead of writing them.</text><rect x="70" y="296" width="300" height="300" fill="white" stroke="#29465c" stroke-width="2"/><text xml:space="preserve" x="220" y="360" font-size="36" text-anchor="middle" font-weight="600">Record</text><text xml:space="preserve" x="220" y="396" font-size="25" text-anchor="middle" fill="#555555">the shared state</text><line x1="100" y1="420" x2="340" y2="420" stroke="#b5b5b5" stroke-width="2"/><text xml:space="preserve" x="220" y="468" font-size="29" text-anchor="middle" >Read once</text><text xml:space="preserve" x="220" y="510" font-size="29" text-anchor="middle" >Cache forked for</text><text xml:space="preserve" x="220" y="550" font-size="29" text-anchor="middle" >every branch</text><path d="M372,446 C404,446 404,291 444,291" fill="none" stroke="#29465c" stroke-width="3"  marker-end="url(#arrow)"/><rect x="450" y="236" width="400" height="110" fill="white" stroke="#171717" stroke-width="2"/><text xml:space="preserve" x="472" y="285" font-size="28" font-weight="600">Noul (yes/no): question</text><text xml:space="preserve" x="472" y="322" font-size="24" fill="#555555">one branch</text><path d="M852,291 L894,291" fill="none" stroke="#29465c" stroke-width="3"  marker-end="url(#arrow)"/><rect x="900" y="236" width="250" height="110" fill="white" stroke="#29465c" stroke-width="2"/><text xml:space="preserve" x="1025" y="285" font-size="28" text-anchor="middle" font-weight="600">Yes/no head</text><text xml:space="preserve" x="1025" y="322" font-size="23" text-anchor="middle" fill="#555555">one score per branch</text><path d="M1152,291 L1190,291" fill="none" stroke="#29465c" stroke-width="3"  marker-end="url(#arrow)"/><text xml:space="preserve" x="1204" y="285" font-size="27" font-weight="600">P(true)</text><text xml:space="preserve" x="1204" y="322" font-size="23" fill="#555555">probability of yes</text><path d="M372,446 C404,446 404,446 444,446" fill="none" stroke="#29465c" stroke-width="3"  marker-end="url(#arrow)"/><rect x="450" y="391" width="400" height="110" fill="white" stroke="#171717" stroke-width="2"/><text xml:space="preserve" x="472" y="440" font-size="28" font-weight="600">Choice: question + option</text><text xml:space="preserve" x="472" y="477" font-size="24" fill="#555555">one branch per option</text><path d="M852,446 L894,446" fill="none" stroke="#29465c" stroke-width="3"  marker-end="url(#arrow)"/><rect x="900" y="391" width="250" height="110" fill="white" stroke="#29465c" stroke-width="2"/><text xml:space="preserve" x="1025" y="440" font-size="28" text-anchor="middle" font-weight="600">Candidate head</text><text xml:space="preserve" x="1025" y="477" font-size="23" text-anchor="middle" fill="#555555">one score per branch</text><path d="M1152,446 L1190,446" fill="none" stroke="#29465c" stroke-width="3"  marker-end="url(#arrow)"/><text xml:space="preserve" x="1204" y="440" font-size="27" font-weight="600">Softmax over options</text><text xml:space="preserve" x="1204" y="477" font-size="23" fill="#555555">winner and distribution</text><path d="M372,446 C404,446 404,601 444,601" fill="none" stroke="#29465c" stroke-width="3"  marker-end="url(#arrow)"/><rect x="450" y="546" width="400" height="110" fill="white" stroke="#171717" stroke-width="2"/><text xml:space="preserve" x="472" y="595" font-size="28" font-weight="600">Score: question + level</text><text xml:space="preserve" x="472" y="632" font-size="24" fill="#555555">one branch per level</text><path d="M852,601 L894,601" fill="none" stroke="#29465c" stroke-width="3"  marker-end="url(#arrow)"/><rect x="900" y="546" width="250" height="110" fill="white" stroke="#29465c" stroke-width="2"/><text xml:space="preserve" x="1025" y="595" font-size="28" text-anchor="middle" font-weight="600">Candidate head</text><text xml:space="preserve" x="1025" y="632" font-size="23" text-anchor="middle" fill="#555555">one score per branch</text><path d="M1152,601 L1190,601" fill="none" stroke="#29465c" stroke-width="3"  marker-end="url(#arrow)"/><text xml:space="preserve" x="1204" y="595" font-size="27" font-weight="600">Softmax over levels</text><text xml:space="preserve" x="1204" y="632" font-size="23" fill="#555555">distribution, expected level</text><line x1="70" y1="700" x2="1530" y2="700" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="70" y="746" font-size="27" >Trained: rank-8 LoRA adapters and the two heads, 0.45% of the parameters. Frozen: the Qwen3.5-2B backbone.</text><text xml:space="preserve" x="70" y="786" font-size="27" >Loss: binary cross-entropy for yes/no questions; cross-entropy over each complete candidate group.</text><text xml:space="preserve" x="70" y="826" font-size="25" fill="#555555">Handled in code, not by the model: question IDs, JSON assembly, the Choice winner and the expected Score.</text></g></svg>