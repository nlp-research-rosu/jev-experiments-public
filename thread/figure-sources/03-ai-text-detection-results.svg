<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AI-text detection with Jev</title><desc id="desc">A three-slice pie shows the outcomes of a separate AI-text detection study using Jev answers and a fitted decision rule. All 44 human-written texts were left unflagged. Of 48 Claude-written texts, 18 were missed and 30 were flagged, or 62.5 percent. A callout marks the fitted detector flag cutoff between missed and flagged Claude texts. The flag threshold was chosen on these same 92 texts, so the zero false alarms observed here should not be treated as a general guarantee. All AI texts came from Claude.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29465c"/></marker></defs><rect width="1600" height="900" fill="white"/><g fill="#171717" font-family="Cambria, Georgia, Times New Roman, serif"><text xml:space="preserve" x="70" y="88" font-size="46" font-weight="600">AI-text detection with Jev</text><text xml:space="preserve" x="70" y="144" font-size="29" fill="#555555">Outcomes for 92 English texts: 44 human-written and 48 Claude-written.</text><path d="M430,465 L430,715 A250,250 0 0 1 395.96,217.33 Z" fill="#c4c4c4" stroke="white" stroke-width="3"/><path d="M430,465 L395.96,217.33 A250,250 0 0 1 651.97,349.98 Z" fill="#8a8a8a" stroke="white" stroke-width="3"/><path d="M430,465 L651.97,349.98 A250,250 0 0 1 430,715 Z" fill="#29465c" stroke="white" stroke-width="3"/><line x1="430" y1="465" x2="651.97" y2="349.98" stroke="#171717" stroke-width="4"/><text xml:space="preserve" x="304" y="480" font-size="52" text-anchor="middle" font-weight="600">44</text><text xml:space="preserve" x="501" y="369" font-size="46" text-anchor="middle" fill="white" font-weight="600">18</text><text xml:space="preserve" x="541" y="547" font-size="52" text-anchor="middle" fill="white" font-weight="600">30</text><text xml:space="preserve" x="701" y="272" font-size="29" fill="#555555">Flag cutoff</text><path d="M804,289 L664.97,342.98" fill="none" stroke="#29465c" stroke-width="3" marker-end="url(#arrow)"/><rect x="840" y="311" width="26" height="26" fill="#c4c4c4"/><text xml:space="preserve" x="890" y="333" font-size="33" font-weight="600">44 human-written</text><text xml:space="preserve" x="890" y="374" font-size="29" fill="#555555">All unflagged: 0 false alarms</text><rect x="840" y="455" width="26" height="26" fill="#8a8a8a"/><text xml:space="preserve" x="890" y="477" font-size="33" font-weight="600">18 Claude-written</text><text xml:space="preserve" x="890" y="518" font-size="29" fill="#555555">Unflagged: missed</text><rect x="840" y="599" width="26" height="26" fill="#29465c"/><text xml:space="preserve" x="890" y="621" font-size="33" font-weight="600">30 Claude-written</text><text xml:space="preserve" x="890" y="662" font-size="29" fill="#555555">Flagged: 62.5% of Claude texts</text><text xml:space="preserve" x="70" y="778" font-size="35" font-weight="600">No human texts flagged; 18 Claude texts missed.</text><text xml:space="preserve" x="70" y="831" font-size="29" fill="#555555">Flag threshold chosen on these same 92 texts; all AI texts came from Claude.</text></g></svg>