<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AI-text detection with Jev</title><desc id="desc">On a separate AI-text detection study, Jev answered eight questions per text chunk and a fitted rule combined four answers. On 92 English texts, the rule flagged zero of 44 human-written texts and 30 of 48 Claude-written texts, or 62.5 percent, as likely AI. In an in-sample breakdown, all seven casual-style Claude texts were missed. The flag threshold was chosen on those same 92 texts, and all AI texts came from Claude.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29465c"/></marker></defs><rect width="1600" height="900" fill="white"/><g fill="#171717" font-family="Cambria, Georgia, Times New Roman, serif"><text xml:space="preserve" x="70" y="88" font-size="46" font-weight="600">AI-text detection with Jev</text><text xml:space="preserve" x="70" y="144" font-size="29" fill="#555555">Share flagged as likely AI in a separate study of 92 English texts.</text><line x1="570" y1="270" x2="570" y2="633" stroke="#b5b5b5" stroke-width="2"/><line x1="797.5" y1="270" x2="797.5" y2="633" stroke="#e4e4e4" stroke-width="2"/><line x1="1025" y1="270" x2="1025" y2="633" stroke="#e4e4e4" stroke-width="2"/><line x1="1252.5" y1="270" x2="1252.5" y2="633" stroke="#e4e4e4" stroke-width="2"/><line x1="1480" y1="270" x2="1480" y2="633" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="70" y="344" font-size="34" font-weight="600">Human-written</text><text xml:space="preserve" x="70" y="390" font-size="29" fill="#555555">0 / 44 flagged</text><text xml:space="preserve" x="590" y="361" font-size="42" font-weight="600">0%</text><text xml:space="preserve" x="70" y="518" font-size="34" font-weight="600">Claude-written</text><text xml:space="preserve" x="70" y="564" font-size="29" fill="#555555">30 / 48 flagged</text><path d="M570,482 H1132.75 A6,6 0 0 1 1138.75,488 V552 A6,6 0 0 1 1132.75,558 H570 Z" fill="#29465c"/><text xml:space="preserve" x="1118.75" y="535" font-size="42" text-anchor="end" fill="white" font-weight="600">62.5%</text><line x1="570" y1="633" x2="1480" y2="633" stroke="#b5b5b5" stroke-width="2"/><text xml:space="preserve" x="570" y="672" font-size="28" text-anchor="middle" fill="#555555">0%</text><text xml:space="preserve" x="797.5" y="672" font-size="28" text-anchor="middle" fill="#555555">25%</text><text xml:space="preserve" x="1025" y="672" font-size="28" text-anchor="middle" fill="#555555">50%</text><text xml:space="preserve" x="1252.5" y="672" font-size="28" text-anchor="middle" fill="#555555">75%</text><text xml:space="preserve" x="1480" y="672" font-size="28" text-anchor="middle" fill="#555555">100%</text><text xml:space="preserve" x="70" y="740" font-size="35" font-weight="600">The detector missed all 7 casual-style Claude texts.</text><text xml:space="preserve" x="70" y="799" font-size="29" fill="#555555">The flag threshold was chosen on these same 92 texts.</text><text xml:space="preserve" x="70" y="844" font-size="29" fill="#555555">The style breakdown is in-sample; all AI texts came from Claude.</text></g></svg>