<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">A fast judgment inside the intent loop?</title><desc id="desc">An exploratory intent loop connects human intent, meaning requirements and constraints, with code, specification, and proof through formalization and refinement. A proposed decision-model judgment asks whether the candidate formal meaning captures the intent, a step currently needing LLM or human review. Formal proof tools separately check whether the stated formal claims hold. The research question is whether cheap, fast judgments can reduce review work while preserving intent.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29465c"/></marker></defs><rect width="1600" height="900" fill="white"/><g fill="#171717" font-family="Cambria, Georgia, Times New Roman, serif"><text xml:space="preserve" x="70" y="88" font-size="46" font-weight="600">A fast judgment inside the intent loop?</text><text xml:space="preserve" x="70" y="144" font-size="29" fill="#555555">The research direction: intent ↔ {code + spec + proof}.</text><rect x="70" y="260" width="470" height="220" fill="#eef2f5" stroke="#29465c" stroke-width="2"/><text xml:space="preserve" x="305" y="325" font-size="39" text-anchor="middle" font-weight="600">Human intent</text><text xml:space="preserve" x="305" y="382" font-size="29" text-anchor="middle" fill="#555555">What we want the system to do</text><text xml:space="preserve" x="305" y="429" font-size="29" text-anchor="middle" fill="#555555">Requirements and constraints</text><rect x="790" y="260" width="740" height="220" fill="white" stroke="#29465c" stroke-width="2"/><text xml:space="preserve" x="1160" y="325" font-size="39" text-anchor="middle" font-weight="600">Code + specification + proof</text><text xml:space="preserve" x="1160" y="382" font-size="30" text-anchor="middle" fill="#555555">A candidate formal meaning</text><text xml:space="preserve" x="1160" y="429" font-size="29" text-anchor="middle" fill="#555555">An implementation and its formal claims</text><text xml:space="preserve" x="665" y="294" font-size="28" text-anchor="middle" fill="#555555">Formalize</text><path d="M552,325 L775,325" fill="none" stroke="#29465c" stroke-width="3" marker-end="url(#arrow)"/><path d="M775,405 L552,405" fill="none" stroke="#29465c" stroke-width="3" marker-end="url(#arrow)"/><text xml:space="preserve" x="665" y="446" font-size="28" text-anchor="middle" fill="#555555">Refine</text><path d="M305,483 L305,568" fill="none" stroke="#29465c" stroke-width="3" marker-end="url(#arrow)"/><path d="M820,483 L820,568" fill="none" stroke="#29465c" stroke-width="3" marker-end="url(#arrow)"/><path d="M1257,483 L1257,568" fill="none" stroke="#29465c" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="580" width="860" height="174" fill="#eef2f5" stroke="#29465c" stroke-width="2"/><text xml:space="preserve" x="500" y="633" font-size="34" text-anchor="middle" font-weight="600">Decision-model judgment (proposed)</text><text xml:space="preserve" x="500" y="684" font-size="31" text-anchor="middle" fill="#555555">Does the formal meaning capture the intent?</text><text xml:space="preserve" x="500" y="726" font-size="28" text-anchor="middle" fill="#555555">The step currently needing LLM or human review</text><rect x="985" y="580" width="545" height="174" fill="white" stroke="#171717" stroke-width="2"/><text xml:space="preserve" x="1257" y="633" font-size="34" text-anchor="middle" font-weight="600">Formal proof checking</text><text xml:space="preserve" x="1257" y="684" font-size="29" text-anchor="middle" fill="#555555">Do the stated formal claims hold?</text><text xml:space="preserve" x="1257" y="726" font-size="28" text-anchor="middle" fill="#555555">Checked by proof tools</text><text xml:space="preserve" x="70" y="836" font-size="31" fill="#555555">Exploratory: can cheap, fast judgments reduce review work while preserving intent?</text></g></svg>