<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Where we would test Jev next</title><desc id="desc">A proposed workflow starts with a shared record containing human intent, candidate formal semantics, and definitions and evidence. Jev answers narrow questions and returns probabilities for first-pass screening. Rejections and uncertain cases are escalated to LLM or human review to investigate and refine. Formal proof checks continue: a favorable intent judgment does not establish the formal claims. Evaluate routing policies on labeled cases before relying on them.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29465c"/></marker></defs><rect width="1600" height="900" fill="white"/><g fill="#171717" font-family="Cambria, Georgia, Times New Roman, serif"><text xml:space="preserve" x="70" y="88" font-size="46" font-weight="600">Where we would test Jev next</text><text xml:space="preserve" x="70" y="144" font-size="29" fill="#555555">Workflow to test: first-pass screening in the intent ↔ {code + spec + proof} loop.</text><rect x="70" y="275" width="490" height="286" fill="white" stroke="#29465c" stroke-width="2"/><text xml:space="preserve" x="315" y="335" font-size="37" text-anchor="middle" font-weight="600">Shared record</text><line x1="105" y1="364" x2="525" y2="364" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="315" y="414" font-size="32" text-anchor="middle" fill="#555555">Human intent</text><text xml:space="preserve" x="315" y="463" font-size="31" text-anchor="middle" fill="#555555">Candidate formal semantics</text><text xml:space="preserve" x="315" y="512" font-size="31" text-anchor="middle" fill="#555555">Definitions and evidence</text><path d="M565,416 L625,416" fill="none" stroke="#29465c" stroke-width="3" marker-end="url(#arrow)"/><rect x="640" y="275" width="355" height="286" fill="#eef2f5" stroke="#29465c" stroke-width="2"/><text xml:space="preserve" x="817" y="335" font-size="37" text-anchor="middle" font-weight="600">Jev judgment</text><line x1="675" y1="364" x2="960" y2="364" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="817" y="420" font-size="31" text-anchor="middle" fill="#555555">Narrow questions</text><text xml:space="preserve" x="817" y="469" font-size="31" text-anchor="middle" fill="#555555">Probabilities</text><text xml:space="preserve" x="817" y="518" font-size="29" text-anchor="middle" fill="#555555">First-pass screening</text><path d="M1000,416 L1060,416" fill="none" stroke="#29465c" stroke-width="3" marker-end="url(#arrow)"/><rect x="1075" y="275" width="455" height="286" fill="white" stroke="#29465c" stroke-width="2"/><text xml:space="preserve" x="1302" y="335" font-size="35" text-anchor="middle" font-weight="600">LLM / human review</text><line x1="1110" y1="364" x2="1495" y2="364" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="1302" y="420" font-size="31" text-anchor="middle" fill="#555555">Escalate rejections</text><text xml:space="preserve" x="1302" y="469" font-size="31" text-anchor="middle" fill="#555555">and uncertain cases</text><text xml:space="preserve" x="1302" y="518" font-size="29" text-anchor="middle" fill="#555555">Investigate and refine</text><rect x="70" y="628" width="1460" height="122" fill="#eef2f5"/><text xml:space="preserve" x="94" y="680" font-size="33" font-weight="600">Formal proof checks continue.</text><text xml:space="preserve" x="94" y="725" font-size="30" fill="#555555">A favorable intent judgment does not establish the formal claims.</text><text xml:space="preserve" x="70" y="828" font-size="29" fill="#555555">Evaluate routing policies on labeled cases before relying on them.</text></g></svg>