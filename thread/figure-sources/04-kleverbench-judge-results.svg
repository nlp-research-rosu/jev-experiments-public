<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Auditing formal specs against intent</title><desc id="desc">A table compares two judges on 45 cases asking whether candidate formal specifications capture the stated intent. Jev with one question got 36 correct, accepted no flawed specs out of 27, rejected 9 faithful specs out of 18, took 1.1 seconds and cost about 0.0006 US dollars per case. The Sonnet agent judge got all 45 correct, accepted no flawed specs, rejected no faithful specs, took 45.7 seconds and cost about 0.17 dollars per case. Three narrower Jev questions got 40 of 45 correct, rejecting five faithful specs and accepting no flawed specs. Costs are approximate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29465c"/></marker></defs><rect width="1600" height="900" fill="white"/><g fill="#171717" font-family="Cambria, Georgia, Times New Roman, serif"><text xml:space="preserve" x="70" y="88" font-size="46" font-weight="600">Auditing formal specs against intent</text><text xml:space="preserve" x="70" y="144" font-size="29" fill="#555555">45 candidate specs: 18 faithful, 27 flawed. 18 flawed specs still prove.</text><text xml:space="preserve" x="70" y="260" font-size="32" font-weight="600">Judge</text><text xml:space="preserve" x="575" y="238" font-size="30" text-anchor="middle" font-weight="600">Correct</text><text xml:space="preserve" x="575" y="276" font-size="27" text-anchor="middle" fill="#555555">/ 45</text><text xml:space="preserve" x="800" y="238" font-size="30" text-anchor="middle" font-weight="600">Bad specs</text><text xml:space="preserve" x="800" y="276" font-size="27" text-anchor="middle" fill="#555555">accepted / 27</text><text xml:space="preserve" x="1020" y="238" font-size="30" text-anchor="middle" font-weight="600">Good specs</text><text xml:space="preserve" x="1020" y="276" font-size="27" text-anchor="middle" fill="#555555">rejected / 18</text><text xml:space="preserve" x="1245" y="238" font-size="30" text-anchor="middle" font-weight="600">Time</text><text xml:space="preserve" x="1245" y="276" font-size="27" text-anchor="middle" fill="#555555">s / case</text><text xml:space="preserve" x="1450" y="238" font-size="30" text-anchor="middle" font-weight="600">Cost</text><text xml:space="preserve" x="1450" y="276" font-size="27" text-anchor="middle" fill="#555555">US$ / case</text><line x1="70" y1="305" x2="1530" y2="305" stroke="#171717" stroke-width="2"/><rect x="70" y="364" width="1460" height="122" fill="#eef2f5"/><text xml:space="preserve" x="90" y="410" font-size="32" font-weight="600">Jev</text><text xml:space="preserve" x="90" y="442" font-size="26" fill="#555555">One question</text><text xml:space="preserve" x="575" y="421" font-size="35" text-anchor="middle" >36</text><text xml:space="preserve" x="800" y="421" font-size="35" text-anchor="middle" >0</text><text xml:space="preserve" x="1020" y="421" font-size="35" text-anchor="middle" >9</text><text xml:space="preserve" x="1245" y="421" font-size="35" text-anchor="middle" >1.1</text><text xml:space="preserve" x="1450" y="421" font-size="35" text-anchor="middle" >~0.0006</text><line x1="70" y1="484" x2="1530" y2="484" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="90" y="560" font-size="32" font-weight="600">Sonnet</text><text xml:space="preserve" x="90" y="592" font-size="26" fill="#555555">Agent judge</text><text xml:space="preserve" x="575" y="571" font-size="35" text-anchor="middle" >45</text><text xml:space="preserve" x="800" y="571" font-size="35" text-anchor="middle" >0</text><text xml:space="preserve" x="1020" y="571" font-size="35" text-anchor="middle" >0</text><text xml:space="preserve" x="1245" y="571" font-size="35" text-anchor="middle" >45.7</text><text xml:space="preserve" x="1450" y="571" font-size="35" text-anchor="middle" >~0.17</text><line x1="70" y1="634" x2="1530" y2="634" stroke="#e4e4e4" stroke-width="2"/><rect x="70" y="690" width="1460" height="114" fill="#eef2f5"/><text xml:space="preserve" x="94" y="742" font-size="33" font-weight="600">Three narrower Jev questions: 40 / 45 correct.</text><text xml:space="preserve" x="94" y="784" font-size="29" fill="#555555">Still rejected 5 of 18 good specs; accepted no bad specs.</text><text xml:space="preserve" x="70" y="852" font-size="27" fill="#555555">3 problems, 3 language variants, 5 spec variants. Approximate costs.</text></g></svg>