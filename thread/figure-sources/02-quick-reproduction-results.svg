<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Correct answers</title><desc id="desc">Two horizontal bars share a zero-to-100-percent scale. Fine-tuned Qwen3.5-2B, after approximately 70 minutes of total training, answered 617 of 700 questions correctly, or 88.1%. Jev 1.13 answered 678 correctly, or 96.9%. The quick side experiment came within 9 percentage points of Jev on this narrow test. The frozen, model-written test covers 35 held-out families. Qwen trained on the same ten semantic categories; Jev was not tuned for them. Five families with missing definitions are excluded. The test was frozen before contrast-data writing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29465c"/></marker></defs><rect width="1600" height="900" fill="white"/><g fill="#171717" font-family="Cambria, Georgia, Times New Roman, serif"><text xml:space="preserve" x="70" y="88" font-size="46" font-weight="600">Correct answers</text><text xml:space="preserve" x="70" y="144" font-size="29" fill="#555555">A frozen, model-written test: 700 questions across 35 held-out families.</text><line x1="570" y1="270" x2="570" y2="633" stroke="#b5b5b5" stroke-width="2"/><line x1="797.5" y1="270" x2="797.5" y2="633" stroke="#e4e4e4" stroke-width="2"/><line x1="1025" y1="270" x2="1025" y2="633" stroke="#e4e4e4" stroke-width="2"/><line x1="1252.5" y1="270" x2="1252.5" y2="633" stroke="#e4e4e4" stroke-width="2"/><line x1="1480" y1="270" x2="1480" y2="633" stroke="#e4e4e4" stroke-width="2"/><text xml:space="preserve" x="70" y="344" font-size="34" font-weight="600">Fine-tuned Qwen3.5-2B</text><text xml:space="preserve" x="70" y="390" font-size="29" fill="#555555">~70 min total training</text><path d="M570,308 H1365.71 A6,6 0 0 1 1371.71,314 V378 A6,6 0 0 1 1365.71,384 H570 Z" fill="#29465c"/><text xml:space="preserve" x="1351.71" y="361" font-size="42" text-anchor="end" fill="white" font-weight="600">88.1%</text><text xml:space="preserve" x="70" y="518" font-size="34" font-weight="600">Jev 1.13</text><text xml:space="preserve" x="70" y="564" font-size="29" fill="#555555">TypeSafe decision model</text><path d="M570,482 H1445.79 A6,6 0 0 1 1451.79,488 V552 A6,6 0 0 1 1445.79,558 H570 Z" fill="#8a8a8a"/><text xml:space="preserve" x="1431.79" y="535" font-size="42" text-anchor="end" fill="white" font-weight="600">96.9%</text><line x1="570" y1="633" x2="1480" y2="633" stroke="#b5b5b5" stroke-width="2"/><text xml:space="preserve" x="570" y="672" font-size="28" text-anchor="middle" fill="#555555">0%</text><text xml:space="preserve" x="797.5" y="672" font-size="28" text-anchor="middle" fill="#555555">25%</text><text xml:space="preserve" x="1025" y="672" font-size="28" text-anchor="middle" fill="#555555">50%</text><text xml:space="preserve" x="1252.5" y="672" font-size="28" text-anchor="middle" fill="#555555">75%</text><text xml:space="preserve" x="1480" y="672" font-size="28" text-anchor="middle" fill="#555555">100%</text><text xml:space="preserve" x="70" y="740" font-size="35" font-weight="600">Within 9 percentage points of Jev on this narrow test.</text><text xml:space="preserve" x="70" y="799" font-size="29" fill="#555555">Qwen trained on the same ten semantic categories; Jev was not tuned for them.</text><text xml:space="preserve" x="70" y="844" font-size="29" fill="#555555">Five families with missing definitions excluded; test frozen before contrast-data writing.</text></g></svg>